# Metro Cardz — Hostinger VPS Deployment
# =========================================
# This file replaces render.yaml — we deploy on Hostinger, not Render.com.
#
# NOTE: Hostinger Web App Hosting supports Node.js only.
#   → The Next.js frontend (app/) deploys on Hostinger Web App.
#   → This Python FastAPI backend runs on Hostinger VPS (if you have VPS).
#   → If you only have Web App Hosting, the Next.js API routes (/api/v1/*)
#     handle everything — this backend is NOT needed.
#
# VPS START COMMANDS:
#   Build:  pip install -r requirements.txt
#   Start:  gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker \
#             --bind 127.0.0.1:8000 --timeout 120 --preload
#
# NGINX reverse proxy: add to /etc/nginx/sites-available/metrocardz
#   location /api/v1/ {
#       proxy_pass http://127.0.0.1:8000;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#   }
#
# SYSTEMD service: /etc/systemd/system/metrocardz-api.service
# DATABASE: Same Hostinger MySQL used by Next.js frontend

# Environment variables — set in /home/deploy/metrocardz/backend/.env
# See .env file for all required variables.
